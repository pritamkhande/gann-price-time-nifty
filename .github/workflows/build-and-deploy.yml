name: Build Gann Reports & Deploy to Pages

on:
  push:
    branches: [ "main" ]

  schedule:
    - cron: "15 10 * * 1-5"   # 10:15 UTC, Mon–Fri (after market close)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All Gann Systems (Nifty + All Stocks + Live Scanner)
        run: |
          python src/build_gann_report.py        # NIFTY main report
          python src/build_all_stocks.py         # ALL stocks reports
          python src/scan_today.py               # Live early-signal scanner

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
